<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destrava - Criar Conta</title>
    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&family=Rammetto+One&display=swap" rel="stylesheet">

</head>
<body>

    <div class="auth-wrapper">
        
        <main class="auth-box">
            
            <div class="logo">
                <span class="logo-box">D</span>
                <span class="logo-text">Destrava</span>
            </div>

            <div class="auth-header">
                <h2>Criar uma conta</h2>
                <p>Comece sua jornada digital gratuitamente agora mesmo!</p>
            </div>

            <form id="formCadastro">
            <p id="mensagem-cadastro"></p>
                <div class="input-group">
                    <label for="reg-name">NOME COMPLETO <span class="required">*</span></label>
                    <input type="text" id="reg-name" required>
                </div>

                <div class="input-group">
                    <label for="reg-email">E-MAIL <span class="required">*</span></label>
                    <input type="email" id="reg-email" required>
                </div>

                <div class="input-group">
                    <label for="reg-password">SENHA <span class="required">*</span></label>
                    <input type="password" id="reg-password" required>
                </div>

                <button type="submit" class="btn-auth-submit">Continuar</button>
                
                <p class="switch-form-text">
                    Já tem uma conta? <a href="Login.html">Fazer login</a>
                </p>
            </form>
        </main>
        
    </div>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
