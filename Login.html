<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destrava - Entrar</title>
    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&family=Rammetto+One&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Container Principal Centralizado -->
    <div class="auth-wrapper">
        
        <!-- Caixa de Autenticação Clean -->
        <main class="auth-box">
            
            <!-- Logotipo centralizado no topo do bloco -->
            <div class="logo">
                <span class="logo-box">D</span>
                <span class="logo-text">Destrava</span>
            </div>

            <div class="auth-header">
                <h2>Boas-vindas de volta!</h2>
                <p>Estamos muito animados em ver você novamente!</p>
            </div>

            <div class="role-toggle">
                <button type="button" class="role-tab active" data-role="aluno">Sou Aluno</button>
                <button type="button" class="role-tab" data-role="admin">Sou Administrador</button>
            </div>

            <form id="formLogin">
                <input type="hidden" id="login-role" value="aluno">
                <div class="input-group">
                    <label for="login-email">E-MAIL OU NÚMERO DE TELEFONE <span class="required">*</span></label>
                    <input type="email" id="login-email" required>
                </div>

                <div class="input-group">
                    <label for="login-password">SENHA <span class="required">*</span></label>
                    <input type="password" id="login-password" required>
                    <a href="#" class="forgot-link">Esqueceu a sua senha?</a>
                </div>

                <button type="submit" class="btn-auth-submit">Entrar</button>
                
                <p class="switch-form-text">
                    Precisando de uma conta? <a href="Cadastro.html">Registre-se</a>
                </p>
            </form>
        </main>

        <!-- Link de Voltar-->
        <div class="back-link-container">
            <a href="indexPaginaInicial.html" class="btn-back">← Voltar para a página inicial</a>
        </div>
        
    </div>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
